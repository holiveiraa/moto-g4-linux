Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "Device"
    Identifier "AtheneFramebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
EndSection

Section "Monitor"
    Identifier "AthenePanel"
EndSection

Section "Screen"
    Identifier "AtheneScreen"
    Device "AtheneFramebuffer"
    Monitor "AthenePanel"
    DefaultDepth 24
EndSection

Section "InputDevice"
    Identifier "AtheneTouch"
    Driver "evdev"
    Option "Device" "/dev/input/moto-touch"
    Option "CorePointer" "true"
    Option "IgnoreRelativeAxes" "true"
    Option "IgnoreAbsoluteAxes" "false"
EndSection

Section "ServerLayout"
    Identifier "AtheneLayout"
    Screen "AtheneScreen"
    InputDevice "AtheneTouch" "CorePointer"
EndSection
