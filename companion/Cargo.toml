[package]
name = "moto-hermes"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Optional native voice companion for an existing Hermes Agent on Umbrel"
publish = false

[dependencies]
base64 = "0.22"
getrandom = "0.2"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "cookies", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
url = "2"
webrtc-vad = "=0.4.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
