<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Moto G4 Linux — your Hermes, alive</title>
  <desc id="desc">Original illustration of two phone modes: an expressive Hermes face and a native Linux terminal. Experimental source port for the Moto G4 Plus XT1640.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1118"/><stop offset="1" stop-color="#142b30"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#68e3bc" stop-opacity=".13"/><stop offset="1" stop-color="#68e3bc" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <ellipse cx="930" cy="280" rx="320" ry="280" fill="url(#glow)"/>
  <g font-family="DejaVu Sans,Segoe UI,Arial,sans-serif">
    <rect x="54" y="47" width="102" height="28" rx="14" fill="#205745"/>
    <text x="105" y="66" text-anchor="middle" fill="#a4f3d7" font-size="12" font-weight="700">MOTO G4 PLUS</text>
    <text x="171" y="66" fill="#8ea9b0" font-size="12" letter-spacing="1.4">EXPERIMENTAL · XT1640</text>
    <text x="50" y="147" fill="#f1f5fa" font-size="57" font-weight="700">Moto G4 Linux</text>
    <text x="54" y="218" fill="#88f0ce" font-size="34" font-weight="700">Your Hermes, alive.</text>
    <text x="54" y="264" fill="#f1f5fa" font-size="25">A face. A voice. Your own agent.</text>
    <text x="54" y="311" fill="#a6bcc3" font-size="18">Say “Olá Hermes”. Talk. Start a new conversation.</text>
    <text x="54" y="340" fill="#a6bcc3" font-size="18">Close the app. Your Linux terminal is right there.</text>
    <g font-size="12" font-weight="700" text-anchor="middle">
      <rect x="54" y="385" width="103" height="34" rx="9" fill="#205745"/><text x="105" y="407" fill="#a4f3d7">HERMES</text>
      <rect x="167" y="385" width="80" height="34" rx="9" fill="#22343d"/><text x="207" y="407" fill="#e5f0f1">RUST</text>
      <rect x="257" y="385" width="93" height="34" rx="9" fill="#22343d"/><text x="303" y="407" fill="#e5f0f1">ALPINE</text>
      <rect x="360" y="385" width="127" height="34" rx="9" fill="#22343d"/><text x="423" y="407" fill="#e5f0f1">SSH + TMUX</text>
    </g>
    <text x="54" y="488" fill="#8ea9b0" font-size="13">A second life for an old phone. Built on the Linux community.</text>
    <text x="54" y="512" fill="#6b8b94" font-size="11">Source available · Bring your own Hermes, accounts and keys.</text>
    <!-- Stylized mode illustrations; actual application captures live in the gallery. -->
    <g transform="translate(662 88) rotate(-7 110 190)">
      <rect width="218" height="397" rx="28" fill="#080d13" stroke="#38505b" stroke-width="2"/>
      <rect x="75" y="13" width="68" height="4" rx="2" fill="#283d47"/>
      <rect x="11" y="30" width="196" height="326" rx="8" fill="#0b1118"/>
      <text x="22" y="49" fill="#eef4ff" font-size="9" font-weight="700">moto / linux</text>
      <rect x="20" y="59" width="90" height="21" rx="3" fill="#205745"/>
      <text x="26" y="73" fill="#a4f3d7" font-size="8">0 · server</text>
      <text x="122" y="73" fill="#a6bcc3" font-size="8">1 · local</text>
      <g font-family="DejaVu Sans Mono,monospace" font-size="8">
        <text x="21" y="103" fill="#68e3bc">demo@server.example:~ $</text>
        <text x="21" y="123" fill="#dce9f7">tmux ls</text>
        <text x="21" y="142" fill="#a6bcc3">work: 2 windows</text>
        <text x="21" y="163" fill="#68e3bc">$</text><rect x="33" y="155" width="5" height="10" fill="#68e3bc"/>
      </g>
      <rect x="17" y="231" width="184" height="117" rx="5" fill="#15232e"/>
      <g fill="#263a48">
        <path d="M22 252h174v24H22zM22 281h174v24H22zM22 310h174v24H22z"/>
      </g>
      <g fill="#dce9f7" text-anchor="middle" font-size="8" font-weight="700">
        <text x="109" y="244">TERM · CODE · PT</text>
        <text x="109" y="268">Esc    Ctrl    Alt    ← ↑ ↓ →</text>
        <text x="109" y="297">q   w   e   r   t   y   u   i   o   p</text>
        <text x="109" y="326">#+=          espaço          ↵</text>
      </g>
      <rect x="91" y="367" width="36" height="15" rx="6" fill="#172731"/>
    </g>
    <g transform="translate(899 49) rotate(5 115 210)">
      <rect width="235" height="432" rx="30" fill="#080d13" stroke="#587f83" stroke-width="2"/>
      <rect x="81" y="13" width="73" height="4" rx="2" fill="#2a424b"/>
      <rect x="11" y="31" width="213" height="362" rx="8" fill="#060b0f"/>
      <text x="117" y="77" fill="#6e959b" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="3">HERMES</text>
      <rect x="46" y="152" width="56" height="62" rx="12" fill="#88f5cf"/>
      <rect x="139" y="152" width="56" height="62" rx="12" fill="#88f5cf"/>
      <circle cx="59" cy="165" r="5" fill="#dcfff2"/><circle cx="152" cy="165" r="5" fill="#dcfff2"/>
      <ellipse cx="45" cy="232" rx="9" ry="3" fill="#153f34"/>
      <ellipse cx="195" cy="232" rx="9" ry="3" fill="#153f34"/>
      <path d="M102 248Q120 260 138 248" fill="none" stroke="#88f5cf" stroke-width="3" stroke-linecap="round"/>
      <text x="117" y="329" fill="#d8ece7" text-anchor="middle" font-size="17">Pode falar</text>
      <text x="117" y="353" fill="#6e959b" text-anchor="middle" font-size="10">Conversa ativa</text>
      <rect x="99" y="404" width="37" height="15" rx="6" fill="#172731"/>
    </g>
    <text x="915" y="525" fill="#6e959b" text-anchor="middle" font-size="10" letter-spacing="1.3">ORIGINAL INTERFACE ILLUSTRATION</text>
  </g>
</svg>
