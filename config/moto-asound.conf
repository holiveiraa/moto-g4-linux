# Native athene: route hardware before using this PCM. A named softvol control
# remains available between playback streams; the vendor stream-volume control
# is ineffective when its PCM is closed.
pcm.moto_softvol {
    type softvol
    slave.pcm "hw:0,0"
    control {
        name "Moto Playback Volume"
        card 0
        count 1
    }
    min_dB -51.0
    max_dB 0.0
    resolution 101
}
pcm.moto_speaker {
    type plug
    slave.pcm "moto_softvol"
}
pcm.!default {
    type asym
    playback.pcm "moto_speaker"
    capture.pcm "plughw:0,0"
}
ctl.!default {
    type hw
    card 0
}
